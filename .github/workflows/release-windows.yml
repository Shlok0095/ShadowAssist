# Pushes to `stag` → rolling prerelease "latest-stag" (real GitHub Release with .exe files).
# Push tag v*.*.* → normal release with checksums.
# Website can link to:
#   https://github.com/<owner>/<repo>/releases/download/latest-stag/ShadowAssist-Setup.exe

name: Release Windows

on:
  workflow_dispatch:
  push:
    branches:
      - stag
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shadowassist-electron/ShadowAssist

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: shadowassist-electron/ShadowAssist/package-lock.json

      - run: npm ci

      - name: Build installers (NSIS + portable)
        run: npm run dist:release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: SHA256 checksums
        run: npm run dist:checksums

      - name: Stable installer name for rolling stag release
        if: github.ref == 'refs/heads/stag'
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $setup = "dist/ShadowAssist-Setup-$ver.exe"
          if (-not (Test-Path $setup)) {
            Get-ChildItem dist
            throw "Missing $setup"
          }
          Copy-Item $setup "dist/ShadowAssist-Setup.exe" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: shadowassist-windows-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            shadowassist-electron/ShadowAssist/dist/ShadowAssist.exe
            shadowassist-electron/ShadowAssist/dist/ShadowAssist-Setup*.exe
            shadowassist-electron/ShadowAssist/dist/SHA256SUMS.txt

      - name: Rolling GitHub Release (every stag push)
        if: github.ref == 'refs/heads/stag'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest-stag
          commit: ${{ github.sha }}
          name: ShadowAssist — latest stag
          body: |
            Automated build from **stag** @ [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            | Asset | Use |
            |------|-----|
            | **ShadowAssist-Setup.exe** | NSIS installer (stable URL for your website) |
            | **ShadowAssist.exe** | Portable |

            **Installer:** `${{ github.server_url }}/${{ github.repository }}/releases/download/latest-stag/ShadowAssist-Setup.exe`
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: |
            shadowassist-electron/ShadowAssist/dist/ShadowAssist-Setup.exe
            shadowassist-electron/ShadowAssist/dist/ShadowAssist.exe
            shadowassist-electron/ShadowAssist/dist/SHA256SUMS.txt

      - name: Versioned GitHub Release (git tag v*.*.*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            shadowassist-electron/ShadowAssist/dist/ShadowAssist.exe
            shadowassist-electron/ShadowAssist/dist/ShadowAssist-Setup-*.exe
            shadowassist-electron/ShadowAssist/dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
