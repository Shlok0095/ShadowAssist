# Pushes to `stag` → rolling prerelease "latest-stag".
# Pushes to `main` / `master` → rolling release "latest" (production channel).
# Push tag v*.*.* → versioned release with checksums.
# Auto-update feed: releases/download/<channel>/latest.yml

name: Release Windows

on:
  workflow_dispatch:
  push:
    branches:
      - stag
      - main
      - master
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shadowassist-electron/ShadowAssist

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: shadowassist-electron/ShadowAssist/package-lock.json

      - name: Set release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            echo "TAG=latest" >> "$GITHUB_OUTPUT"
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
            echo "CHANNEL=latest" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=latest-stag" >> "$GITHUB_OUTPUT"
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
            echo "CHANNEL=latest-stag" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Write auto-update channel file
        run: node scripts/write-update-channel.cjs ${{ steps.tag.outputs.CHANNEL }}

      - name: Build installers (NSIS + portable)
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SHA256 checksums
        run: npm run dist:checksums

      - name: Stable installer name for rolling release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $setup = "dist/VeilAssist-Setup-$ver.exe"
          if (-not (Test-Path $setup)) {
            Get-ChildItem dist
            throw "Missing $setup"
          }
          Copy-Item $setup "dist/VeilAssist-Setup.exe" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: veilassist-windows-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            shadowassist-electron/ShadowAssist/dist/VeilAssist.exe
            shadowassist-electron/ShadowAssist/dist/VeilAssist-Setup*.exe
            shadowassist-electron/ShadowAssist/dist/latest.yml
            shadowassist-electron/ShadowAssist/dist/SHA256SUMS.txt

      - name: Rolling GitHub Release (stag / main)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag.outputs.TAG }}
          commit: ${{ github.sha }}
          name: VeilAssist — ${{ steps.tag.outputs.TAG }}
          body: |
            Automated build from **${{ github.ref_name }}** @ [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            | Asset | Use |
            |------|-----|
            | **VeilAssist-Setup.exe** | NSIS one-click installer |
            | **VeilAssist.exe** | Portable |
            | **latest.yml** | Auto-update metadata |

            **Installer:** `${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.tag.outputs.TAG }}/VeilAssist-Setup.exe`
          prerelease: ${{ steps.tag.outputs.PRERELEASE }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: |
            shadowassist-electron/ShadowAssist/dist/VeilAssist-Setup.exe
            shadowassist-electron/ShadowAssist/dist/VeilAssist.exe
            shadowassist-electron/ShadowAssist/dist/latest.yml
            shadowassist-electron/ShadowAssist/dist/SHA256SUMS.txt

      - name: Versioned GitHub Release (git tag v*.*.*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            shadowassist-electron/ShadowAssist/dist/VeilAssist.exe
            shadowassist-electron/ShadowAssist/dist/VeilAssist-Setup-*.exe
            shadowassist-electron/ShadowAssist/dist/latest.yml
            shadowassist-electron/ShadowAssist/dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
