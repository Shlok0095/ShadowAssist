# Serves landing at GitHub Pages (Source: GitHub Actions).
name: Deploy landing to GitHub Pages

on:
  push:
    branches:
      - stag
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Build landing (Vite)
        run: npm ci && npm run build
        working-directory: landing
        env:
          VITE_BASE_PATH: '/${{ github.event.repository.name }}/'
          VITE_REPO_OWNER: ${{ github.repository_owner }}
          VITE_REPO_NAME: ${{ github.event.repository.name }}
          VITE_ROLLING_TAG: latest-stag
          VITE_SITE_ORIGIN: https://veilassist.vercel.app

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

      - id: deployment
        uses: actions/deploy-pages@v4
