# Serves landing/ at https://<user>.github.io/<repo>/ after you enable Pages (Source: GitHub Actions).
name: Deploy landing to GitHub Pages

on:
  push:
    branches: ['stag']
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing

      - id: deployment
        uses: actions/deploy-pages@v4
